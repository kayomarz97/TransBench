# TransBench-owned LLM provider registry — Anthropic only (Haiku, Sonnet, Opus).
#
# Point PROVIDERS_CONFIG_PATH here (run_http.sh does). Trimmed to just the Anthropic
# provider TransBench uses, plus the deep tier (claude-opus-4-8) so hypothesize +
# experiment-design can run on Opus. Iatronix's own providers.yaml is untouched.
# Loaded by provider_registry.py at startup. Prices are USD per 1,000,000 tokens.

version: 1
default_provider: anthropic

providers:
  anthropic:
    display: "Anthropic (Claude)"
    enabled: true
    client_kind: anthropic
    base_url: https://api.anthropic.com
    key_column: anthropic_api_key
    key_prefix: "sk-ant-"
    signup_url: https://console.anthropic.com
    blurb: "Claude models. Your key is read from .env, never committed."
    cache_class: inline          # Anthropic-style cache_control breakpoints
    supports_vision: true
    embedding_model: null        # TransBench does no embedding / vector search
    default_model: claude-haiku-4-5-20251001
    validation:
      probe_model: claude-haiku-4-5-20251001
      api_version: "2023-06-01"
    models:
      - id: claude-haiku-4-5-20251001
        display: "Claude Haiku 4.5"     # mechanical tier: grade / entail / assemble / neutralize
        input: 1.00
        output: 5.00
        cache_write_5m: 1.25
        cache_write_1h: 2.00
        cache_read: 0.10
        min_cache_tokens: 4096          # Haiku 4.5 floor is 4096, not 1024
        context_window: 200000
        supports_caching: true
        tier: 1
        roles: [classify, generate]
      - id: claude-sonnet-4-6
        display: "Claude Sonnet 4.6"    # reasoning tier: decompose / novelty
        input: 3.00
        output: 15.00
        cache_write_5m: 3.75
        cache_write_1h: 6.00
        cache_read: 0.30
        min_cache_tokens: 1024
        context_window: 200000
        supports_caching: true
        tier: 2
        roles: [reason]
      - id: claude-opus-4-8
        display: "Claude Opus 4.8"      # deep tier (MODEL_DEEP): hypothesize / experiment-design
        input: 15.00
        output: 75.00
        cache_write_5m: 18.75
        cache_write_1h: 30.00
        cache_read: 1.50
        min_cache_tokens: 1024
        context_window: 200000
        supports_caching: true
        supports_temperature: false     # Opus 4.8 API 400s on a temperature request param
        tier: 3
        roles: [deep_reason]
