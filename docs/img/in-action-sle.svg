<svg xmlns="http://www.w3.org/2000/svg" width="900" height="854" viewBox="0 0 900 854" role="img" aria-label="TransBench generate_experiment output for a lupus (SLE) observation on the Gladstone dataset: six decomposed axes, three hypotheses (H2 and H3 grounded against real citations, H1 demoted as ungrounded), a top experiment probing PTPN2 in CD4+ regulatory versus conventional T cells in the content-verified Gladstone/Marson Perturb-CITE-seq dataset GSE278572 with a 9-step protocol, and a paste-ready claude_science_prompt. 41 references, temperature 0."><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B7DF6"/></linearGradient><radialGradient id="glowT" cx="0.1" cy="0.95" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.07"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="glowV" cx="0.92" cy="0.05" r="0.4"><stop offset="0" stop-color="#8B7DF6" stop-opacity="0.09"/><stop offset="1" stop-color="#8B7DF6" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="16" y="16" width="868" height="822" rx="18"/></clipPath></defs><rect x="16" y="16" width="868" height="822" rx="18" fill="#0A0E14" stroke="#ffffff" stroke-opacity="0.09"/><g clip-path="url(#card)"><rect x="16" y="16" width="868" height="822" fill="url(#glowT)"/><rect x="16" y="16" width="868" height="822" fill="url(#glowV)"/></g><text x="44" y="49.0" fill="url(#brand)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="0.2">TransBench</text><text x="44" y="67.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" letter-spacing="0.1">MCP connector · live-captured Gladstone run</text><text x="856" y="52.0" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-