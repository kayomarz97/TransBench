><text x="758.4" y="537.6" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">verified · resolvable</text><text x="68.0" y="582.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">question</text><text x="152.0" y="582.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Does PTPN2 show preferential upregulation in CD4+CD25+ regulatory T cells relative to conventional</text><text x="152.0" y="600.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">CD4+ T cells within the Gladstone GSE278572 CD4+ Treg/Teff dataset, and does its expression correlate</text><text x="152.0" y="618.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">with type I IFN-response gene signatures in a Treg-specific manner consistent with the proposed</text><text x="152.0" y="636.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">IFN→PTPN2→impaired STAT5 axis?</text><text x="68.0" y="662.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">protocol</text><text x="152.0" y="662.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-we