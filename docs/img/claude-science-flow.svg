<svg xmlns="http://www.w3.org/2000/svg" width="900" height="439" viewBox="0 0 900 439" role="img" aria-label="How the TransBench MCP connector runs: a free-text clinician observation flows through the TransBench engine (8 agents, 3 rigor gates) to a grounded brief, then a content-verified dataset and a paste-ready claude_science_prompt that Claude Science turns into a reproducible figure. Tools: generate_experiment, search_grounded_evidence, get_experiment_result."><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a52"/><stop offset="1" stop-color="#0e7490"/></linearGradient><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0b1324" flood-opacity="0.14"/></filter></defs><rect x="16" y="16" width="868" height="407.0" rx="18" fill="#ffffff" stroke="#e4e9f1" filter="url(#shadow)"/><path d="M16.0 34.0 a18 18 0 0 1 18 -18 h832.0 a18 18 0 0 1 18 18 v46.0 h-868.0 z" fill="url(#brand)"/><text x="44" y="45.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.2">TransBench</text><text x="44" y="63.0" fill="#bfe3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600">MCP connector · Claude Science</text><text x="856" y="52.0" fill="#eaf6fb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" text-anchor="end">how the connector runs</text><text x="44.0" y="120.0" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" xml:space="preserve">From a bedside sentence to a reproducible figure</text><text x="44.0" y="142.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">One tool call — the connector does the grounding, verification, and hand-off.</text><line x1="190.2" y1="245.0" x2="199.2" y2="245.0" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/><path d="M208.2 245.0 L199.2 249.5 L199.2 240.5 z" fill="#cbd5e1"/><line x1="357.4" y1="245.0" x2="366.4" y2="245.0" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/><path d="M375.4 245.0 L366.4 249.5 L366.4 240.5 z" fill="#cbd5e1"/><line x1="524.6" y1="245.0" x2="533.6" y2="245.0" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/><path d="M542.6 245.0 L533.6 249.5 L533.6 240.5 z" fill="#cbd5e1"/><line x1="691.8" y1="245.0" x2="700.8" y2="245.0" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round"/><path d="M709.8 245.0 L700.8 249.5 L700.8 240.5 z" fill="#cbd5e1"/><rect x="44.0" y="192.0" width="143.2" height="106.0" rx="13" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><circle cx="115.6" cy="192.0" r="16" fill="#ffffff"/><circle cx="115.6" cy="192.0" r="14" fill="#2563eb"/><text x="115.6" y="197.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle" xml:space="preserve">1</text><text x="115.6" y="238.0" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" xml:space="preserve">Observation</text><text x="115.6" y="258.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">free text</text><text x="115.6" y="272.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">any disease / drug</text><rect x=