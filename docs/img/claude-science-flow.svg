potheses</text><text x="450.0" y="272.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">content-verified dataset</text><rect x="545.6" y="192.0" width="143.2" height="106.0" rx="13" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><circle cx="617.2" cy="192.0" r="16" fill="#ffffff"/><circle cx="617.2" cy="192.0" r="14" fill="#0e9f6e"/><text x="617.2" y="197.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle" xml:space="preserve">4</text><text x="617.2" y="238.0" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" xml:space="preserve">Paste-ready</text><text x="617.2" y="258.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">claude_science_prompt</text><rect x="712.8" y="192.0" width="143.2" height="106.0" rx="13" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><circle cx="784.4" cy="192.0" r="16" fill="#ffffff"/><circle cx="784.4" cy="192.0" r="14" fill="#0e7490"/><text x="784.4" y="197.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle" xml:space="preserve">5</text><text x="784.4" y="238.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" xml:space="preserve">Claude Science</text><text x="784.4" y="258.0" fill="#cfeaf1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">reproducible figure</text><text x="44.0" y="330.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.7" xml:space="preserve">MCP TOOLS EXPOSED</text><text x="856.0" y="330.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">async submit + poll · returns a job_id in &lt;1s</text><rect x="44.0" y="342.5" width="178.2" height="23.0" rx="11.5" fill="#eef2f8" stroke="#e4e9f1" stroke-width="1"/><text x="133.1" y="358.1" fill="#334155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" text-anchor="middle" xml:space="preserve">generate_experiment()</text><rect x="230.2" y="342.5" width="215.4" height="23.0" rx="11.5" fill="#eef2f8" stroke="#e4e9f1" stroke-width="1"/><text x="338.0" y="358.1" fill="#334155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" text-anchor="middle" xml:space="preserve">search_grounded_evidence()</text><rect x="453.7" y="342.5" width="193.1" height="23.0" rx="11.5" fill="#eef2f8" stroke="#e4e9f1" stroke-width="1"/><text x="550.2" y="358.1" fill="#334155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" text-anchor="middle" xml:space="preserve">get_experiment_result()</text><text x="44.0" y="379.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" text-anchor="start" xml:space="preserve">Runs locally · bring-your-own Anthropic key · de-identify observations before submitting.</text><text x="44.0" y="393.0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>