ext-anchor="start" letter-spacing="0.7" xml:space="preserve">HYPOTHESES</text><text x="856.0" y="331.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">each graded against real retrieved evidence</text><circle cx="49.0" cy="355.0" r="5" fill="none" stroke="#F5B759" stroke-width="2"/><text x="64.0" y="359.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" xml:space="preserve">H1</text><rect x="90.0" y="344.2" width="69.0" height="21.5" rx="10.75" fill="#F5B759"/><text x="124.5" y="358.6" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">demoted</text><text x="169.0" y="359.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" xml:space="preserve">ungrounded → not shipped as an experiment</text><circle cx="49.0" cy="385.0" r="5" fill="#34D399"/><text x="64.0" y="389.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" xml:space="preserve">H2</text><rect x="90.0" y="374.2" width="75.8" height="21.5" rx="10.75" fill="#34D399"/><text x="127.9" y="388.6" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">GROUNDED</text><text x="175.8" y="389.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" xml:space="preserve">open question · supports 1</text><t