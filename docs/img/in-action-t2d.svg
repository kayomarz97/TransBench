<svg xmlns="http://www.w3.org/2000/svg" width="780" height="638" viewBox="0 0 780 638" role="img" aria-label="TransBench · generate_experiment()  —  type 2 diabetes (live-captured, real PubMed)"><rect x="0.5" y="0.5" width="779" height="637" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="0.5" y="0.5" width="779" height="40" rx="10" fill="#161b22"/><rect x="0.5" y="30" width="779" height="11" fill="#161b22"/><line x1="0" y1="41" x2="780" y2="41" stroke="#30363d"/><circle cx="20" cy="20" r="5" fill="#f85149"/><circle cx="38" cy="20" r="5" fill="#d29922"/><circle cx="56" cy="20" r="5" fill="#3fb950"/><text x="76" y="25" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">TransBench · generate_experiment()  —  type 2 diabetes (live-captured, real PubMed)</text><text x="24" y="68" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" xml:space="preserve">CLINICIAN INPUT</text><text x="24" y="89" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">49M, type 2 diabetes with persistent postprandial hyperglycemia despite metformin at maximal</text><text x="24" y="110" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">dose and confirmed adherence; elevated fasting glucagon; blunted GLP-1 response to mixed-</text><text x="24" y="131" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">meal testing.</text><text x="24" y="160" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" xml:space="preserve">BIOLOGICAL AXES  (decomposed, free-form)</text><text x="24" y="181" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">[insulin_secretion_beta_cell_dysfunction]  [metformin_efficacy_limitation]</text><text x="24" y="202" fill="#58a6ff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">[postprandial_glucose_dysregulation]  [treatment_intensification_need]</text><text x="24" y="231" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" xml:space="preserve">HYPOTHESES  (each graded against real retrieved evidence)</text><text x="24" y="252" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">○ H1  open_question · ungrounded → demoted, not shipped as an experiment</text><text x="24" y="273" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">● H2  open_question · GROUNDED · supports=1 · PMID 37546319, 39422716</text><text x="24" y="294" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">○ H3  open_question · ungrounded → demoted, not shipped as an experiment</text><text x="24" y="323" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" xml:space="preserve">TOP EXPERIMENT  (only the grounded hypothesis, H2, is promoted)</text><text x="24" y="344" fill="#bc8cff" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">dataset  : Tabula Sapiens (immune compartment)   [verified · resolvable]</text><text x="24" y="365" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">question : Does Tabula Sapiens single-cell transcriptomic data from hepatocytes reveal age-associated</text><text x="24" y="386" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">           and sex-associated decline in SLC22A1 (OCT1) and SLC22A3 (OCT3) expression, and do co-</text><text x="24" y="407" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">           expression patterns with AMPK pathway genes (PRKAA1, PRKAA2) support a pharmacokinetic-</text><text x="24" y="428" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">           pharmacodynamic dissociation model for metformin hepatic efficacy limitation?</text><text x="24" y="449" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">protocol : 14 ordered, runnable steps · confirm_if + refute_if specified</text><text x="24" y="478" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="bold" xml:space="preserve">claude_science_prompt  (paste-ready into Claude Science)</text><text x="24" y="499" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">Using the Tabula Sapiens dataset available at https://tabula-sapiens-</text><text x="24" y="520" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">portal.ds.czbiohub.org/, load the liver organ h5ad file. Subset to cells annotated as</text><text x="24" y="541" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="normal" xml:space="preserve">'hepatocyte' in the cell_ontology_class field. Extract …</text><text x="24" y="572" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="normal" xml:space="preserve">17 resolvable references · temperature 0 · reproduce byte-identical: TRANSBENCH_MODE=golden</text><text x="24" y="593" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="normal" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>