cSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">Tabula Sapiens (immune compartment)</text><rect x="676.9" y="474.2" width="163.1" height="21.5" rx="10.75" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.5" stroke-width="1"/><text x="758.4" y="488.6" fill="#34D399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">verified · resolvable</text><text x="68.0" y="515.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">question</text><text x="152.0" y="515.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Does Tabula Sapiens single-cell transcriptomic data from hepatocytes reveal age-associated and sex-</text><text x="152.0" y="533.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">associated decline in SLC22A1 (OCT1) and SLC22A3 (OCT3) expression, and do co-expression patterns with</text><text x="152.0" y="551.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">AMPK pathway genes (PRKAA1, PRKAA2) support a pharmacokinetic-pharmacodynamic dissociation model for</text><text x="152.0" y="569.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">metformin hepatic efficacy limitation?</text><text x="68.0" y="595.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">protocol</text><text x="152.0" y="595.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">14 ordered, runnable steps · confirm_if + refute_if specified</text><text x="44.0" y="625.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.7" xml:space="preserve">CLAUDE_SCIENCE_PROMPT</text><text x="856.0" y="625.0" fill="#2DD4BF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">paste-ready into Claude Science</text><rect x="44.0" y="643.0" width="812.0" height="74.0" rx="11" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1"/><text x="68.0" y="661.0" fill="#7FD9CC" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Using the Tabula Sapiens dataset available at https://tabula-sapiens-portal.ds.czbiohub.org/, load the</text><text x="68.0" y="679.0" fill="#7FD9CC" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">liver organ h5ad file. Subset to cells annotated as 'hepatocyte' in the cell_ontology_class field. Extract</text><text x="68.0" y="697.0" fill="#7FD9CC" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">donor-level …</text><text x="44.0" y="737.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" text-anchor="start" xml:space="preserve">17 resolvable references   ·   temperature 0   ·   TRANSBENCH_MODE=golden replays this byte-identical, keyless</text><text x="44.0" y="755.0" fill="#4A5568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>
