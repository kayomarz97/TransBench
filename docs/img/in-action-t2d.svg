stem,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start" xml:space="preserve">H3</text><rect x="90.0" y="404.2" width="69.0" height="21.5" rx="10.75" fill="#fdf4e4" stroke="#eed9ac" stroke-width="1"/><text x="124.5" y="418.6" fill="#b45309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">demoted</text><text x="169.0" y="419.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" text-anchor="start" xml:space="preserve">ungrounded → not shipped as an experiment</text><text x="44.0" y="447.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.7" xml:space="preserve">TOP EXPERIMENT</text><text x="856.0" y="447.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">only the grounded hypothesis is promoted</text><rect x="44.0" y="465.0" width="812.0" height="168.0" rx="11" fill="#e7f7ef" stroke="#a9e2c9" stroke-width="1"/><rect x="54.0" y="475.0" width="4" height="148.0" rx="2.0" fill="#0e9f6e"/><text x="68.0" y="489.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">dataset</text><text x="152.0" y="489.0" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="start" xml:space="preserve">Tabula Sapiens (immune compartment)</text><rect x="676.9" y="474.2" width="163.1" height="21.5" rx="10.75" fill="#f2ebfd" stroke="#d8c1f8" stroke-width="1"/><text x="758.4" y="488.6" fill="#7c3aed" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">verified · resolvable</text><text x="68.0" y="515.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">question</text><text x="152.0" y="515.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Does Tabula Sapiens single-cell transcriptomic data from hepatocytes reveal age-associated and sex-</text><text x="152.0" y="533.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">associated decline in SLC22A1 (OCT1) and SLC22A3 (OCT3) expression, and do co-expression patterns with</text><text x="152.0" y="551.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">AMPK pathway genes (PRKAA1, PRKAA2) support a pharmacokinetic-pharmacodynamic dissociation model for</text><text x="152.0" y="569.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">metformin hepatic efficacy limitation?</text><text x="68.0" y="595.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">protocol</text><text x="152.0" y="595.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">14 ordered, runnable steps · confirm_if + refute_if specified</text><text x="44.0" y="647.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.7" xml:space="preserve">CLAUDE_SCIENCE_PROMPT</text><text x="856.0" y="647.0" fill="#0e7490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">paste-ready into Claude Science</text><rect x="44.0" y="665.0" width="812.0" height="74.0" rx="11" fill="#e3f2f6" stroke="#a9d9e5" stroke-width="1"/><rect x="54.0" y="673.0" width="4" height="58.0" rx="2.0" fill="#0e7490"/><text x="68.0" y="683.0" fill="#0b3a49" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">Using the Tabula Sapiens dataset available at https://tabula-sapiens-portal.ds.czbiohub.org/, load the</text><text x="68.0" y="701.0" fill="#0b3a49" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">liver organ h5ad file. Subset to cells annotated as 'hepatocyte' in the cell_ontology_class field. Extract</text><text x="68.0" y="719.0" fill="#0b3a49" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">donor-level …</text><text x="44.0" y="759.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" text-anchor="start" xml:space="preserve">17 resolvable references   ·   temperature 0   ·   TRANSBENCH_MODE=golden replays this byte-identical, keyless</text><text x="44.0" y="777.0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>