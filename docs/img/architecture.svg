<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-label="TransBench architecture: an MCP client (Claude Science, HTTP, or CLI) calls generate_experiment on the TransBench repo, whose FastMCP server drives an 8-agent LangGraph engine with live/snapshot/golden modes. The engine imports DB-free leaf functions from the Iatronix backend read-only (never writing) and calls external services — PubMed, Europe PMC, GEO/Tabula Sapiens, and the Anthropic API via BYOK — returning a TransBrief as JSON."><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102a52"/><stop offset="1" stop-color="#0e7490"/></linearGradient><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#0b1324" flood-opacity="0.14"/></filter></defs><rect x="16" y="16" width="868" height="444.0" rx="18" fill="#ffffff" stroke="#e4e9f1" filter="url(#shadow)"/><path d="M16.0 34.0 a18 18 0 0 1 18 -18 h832.0 a18 18 0 0 1 18 18 v46.0 h-868.0 z" fill="url(#brand)"/><text x="44" y="45.0" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="0.2">TransBench</text><text x="44" y="63.0" fill="#bfe3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600">standalone · reuses Iatronix read-only</text><text x="856" y="52.0" fill="#eaf6fb" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" text-anchor="end">architecture</text><text x="44.0" y="120.0" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" xml:space="preserve">A standalone repo that reuses a mature backend — read-only</text><text x="44.0" y="142.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">TransBench imports DB-free leaf functions and never writes to Iatronix.</text><rect x="338.0" y="172.0" width="226.0" height="250.0" rx="13" fill="#f4f8ff" stroke="#c3d3fb" stroke-width="1"/><text x="451.0" y="198.0" fill="#2563eb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5" xml:space="preserve">TRANSBENCH · THIS REPO</text><rect x="354.0" y="214.0" width="194.0" height="52.0" rx="12" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><rect x="365.0" y="225.0" width="4" height="30.0" rx="2.0" fill="#2563eb"/><text x="456.0" y="236.6" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">mcp_server</text><text x="456.0" y="253.6" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">FastMCP · stdio + HTTP</text><rect x="354.0" y="276.0" width="194.0" height="52.0" rx="12" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><rect x="365.0" y="287.0" width="4" height="30.0" rx="2.0" fill="#7c3aed"/><text x="456.0" y="298.6" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">engine.run_transbench</text><text x="456.0" y="315.6" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">8-agent LangGraph pipeline</text><rect x="354.0" y="338.0" width="194.0" height="52.0" rx="12" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><rect x="365.0" y="349.0" width="4" height="30.0" rx="2.0" fill="#0e7490"/><text x="456.0" y="360.6" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">modes</text><text x="456.0" y="377.6" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">live · snapshot · golden</text><line x1="451.0" y1="266.0" x2="451.0" y2="269.0" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/><path d="M451.0 276.0 L447.5 269.0 L454.5 269.0 z" fill="#cbd5e1"/><line x1="451.0" y1="328.0" x2="451.0" y2="331.0" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/><path d="M451.0 338.0 L447.5 331.0 L454.5 331.0 z" fill="#cbd5e1"/><rect x="44.0" y="243.0" width="190.0" height="118.0" rx="13" fill="#f7f9fc" stroke="#e4e9f1" stroke-width="1"/><text x="139.0" y="269.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.6" xml:space="preserve">MCP CLIENT</text><rect x="60.0" y="286.0" width="158.0" height="52.0" rx="12" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><rect x="71.0" y="297.0" width="4" height="30.0" rx="2.0" fill="#0e7490"/><text x="144.0" y="308.6" fill="#0b1324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">Claude Science</text><text x="144.0" y="325.6" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">or HTTP · direct CLI</text><rect x="616.0" y="172.0" width="240.0" height="116.0" rx="13" fill="#e7f7ef" stroke="#a9e2c9" stroke-width="1"/><rect x="632.0" y="185.8" width="76.7" height="20.5" rx="10.25" fill="#0e9f6e"/><text x="670.4" y="199.2" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" xml:space="preserve">READ-ONLY</text><text x="840.0" y="199.0" fill="#0e9f6e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="end" xml:space="preserve">Iatronix backend</text><text x="634.0" y="224.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="700" text-anchor="start" xml:space="preserve">DB-free leaf functions:</text><text x="634.0" y="243.0" fill="#334155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve">fetch_evidence · rank_articles</text><text x="634.0" y="261.0" fill="#334155" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve">grounding_gate · create_llm</text><rect x="616.0" y="306.0" width="240.0" height="116.0" rx="13" fill="#f7f9fc" stroke="#e4e9f1" stroke-width="1"/><text x="736.0" y="330.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5" xml:space="preserve">EXTERNAL SERVICES</text><text x="634.0" y="352.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">PubMed / ClinicalTrials.gov</text><text x="634.0" y="368.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">Europe PMC / Semantic Scholar</text><text x="634.0" y="384.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">GEO / Tabula Sapiens</text><text x="634.0" y="400.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">Anthropic API · BYOK</text><line x1="234.0" y1="284.0" x2="330.0" y2="284.0" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/><path d="M338.0 284.0 L330.0 288.0 L330.0 280.0 z" fill="#cbd5e1"/><rect x="228.7" y="262.0" width="114.5" height="18.0" rx="9.0" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><text x="286.0" y="274.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">generate_experiment()</text><line x1="338.0" y1="320.0" x2="242.0" y2="320.0" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round"/><path d="M234.0 320.0 L242.0 316.0 L242.0 324.0 z" fill="#0e7490"/><rect x="238.3" y="324.0" width="95.4" height="18.0" rx="9.0" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><text x="286.0" y="336.1" fill="#0e7490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">TransBrief · JSON</text><line x1="564.0" y1="294.0" x2="611.0" y2="236.2" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M616.0 230.0 L614.1 238.7 L607.9 233.7 z" fill="#cbd5e1"/><rect x="568.6" y="253.0" width="42.7" height="18.0" rx="9.0" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><text x="590.0" y="265.1" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">import</text><line x1="564.0" y1="310.0" x2="610.5" y2="358.2" stroke="#0e7490" stroke-width="2.2" stroke-linecap="round"/><path d="M616.0 364.0 L607.6 361.0 L613.3 355.5 z" fill="#0e7490"/><rect x="566.2" y="328.0" width="47.5" height="18.0" rx="9.0" fill="#ffffff" stroke="#e4e9f1" stroke-width="1"/><text x="590.0" y="340.1" fill="#0e7490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">queries</text><text x="44.0" y="430.0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>