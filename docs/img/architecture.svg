<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-label="TransBench architecture: an MCP client (Claude Science, HTTP, or CLI) calls generate_experiment on the TransBench repo, whose FastMCP server drives an 8-agent LangGraph engine with live/snapshot/golden modes. The engine imports DB-free leaf functions from the Iatronix backend read-only (never writing) and calls external services — PubMed, Europe PMC, GEO/Tabula Sapiens, and the Anthropic API via BYOK — returning a TransBrief as JSON."><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B7DF6"/></linearGradient><radialGradient id="glowT" cx="0.12" cy="0.92" r="0.55"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.08"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="glowV" cx="0.9" cy="0.1" r="0.5"><stop offset="0" stop-color="#8B7DF6" stop-opacity="0.10"/><stop offset="1" stop-color="#8B7DF6" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="16" y="16" width="868" height="444" rx="18"/></clipPath></defs><rect x="16" y="16" width="868" height="444" rx="18" fill="#0A0E14" stroke="#ffffff" stroke-opacity="0.09"/><g clip-path="url(#card)"><rect x="16" y="16" width="868" height="444" fill="url(#glowT)"/><rect x="16" y="16" width="868" height="444" fill="url(#glowV)"/></g><text x="44" y="49.0" fill="url(#brand)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="0.2">TransBench</text><text x="44" y="67.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" letter-spacing="0.1">standalone · reuses Iatronix read-only</text><text x="856" y="52.0" fill="#4A5568" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="0.16" text-anchor="end">ARCHITECTURE</text><line x1="44" y1="83" x2="856" y2="83" stroke="#ffffff" stroke-opacity="0.07"/><text x="44.0" y="120.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" xml:space="preserve">A standalone repo that reuses a mature backend — read-only</text><text x="44.0" y="142.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">TransBench imports DB-free leaf functions and never writes to Iatronix.</text><rect x="338.0" y="172.0" width="226.0" height="250.0" rx="13" fill="#0F1622" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1"/><text x="451.0" y="198.0" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5" xml:space="preserve">TRANSBENCH · THIS REPO</text><rect x="354.0" y="214.0" width="194.0" height="52.0" rx="12" fill="#18212E" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/><text x="451.0" y="236.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">mcp_server</text><text x="451.0" y="253.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">FastMCP · stdio + HTTP</text><rect x="354.0" y="276.0" width="194.0" height="52.0" rx="12" fill="#18212E" stroke="#8B7DF6" stroke-opacity="0.45" stroke-width="1"/><text x="451.0" y="298.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">engine.run_transbench</text><text x="451.0" y="315.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">8-agent LangGraph pipeline</text><rect x="354.0" y="338.0" width="194.0" height="52.0" rx="12" fill="#18212E" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/><text x="451.0" y="360.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">modes</text><text x="451.0" y="377.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">live · snapshot · golden</text><line x1="451.0" y1="266.0" x2="451.0" y2="269.0" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/><path d="M451.0 276.0 L447.5 269.0 L454.5 269.0 z" fill="#2DD4BF" fill-opacity="0.7"/><line x1="451.0" y1="328.0" x2="451.0" y2="331.0" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/><path d="M451.0 338.0 L447.5 331.0 L454.5 331.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="44.0" y="243.0" width="190.0" height="118.0" rx="13" fill="#0F1622" stroke="#8B7DF6" stroke-opacity="0.32" stroke-width="1"/><text x="139.0" y="269.0" fill="#8B7DF6" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.6" xml:space="preserve">MCP CLIENT</text><rect x="60.0" y="286.0" width="158.0" height="52.0" rx="12" fill="#18212E" stroke="#8B7DF6" stroke-opacity="0.4" stroke-width="1"/><text x="139.0" y="308.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">Claude Science</text><text x="139.0" y="325.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">or HTTP · direct CLI</text><rect x="616.0" y="172.0" width="240.0" height="116.0" rx="13" fill="#0F1622" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1"/><rect x="632.0" y="185.8" width="76.7" height="20.5" rx="10.25" fill="#34D399"/><text x="670.4" y="199.2" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" xml:space="preserve">READ-ONLY</text><text x="840.0" y="199.0" fill="#2DD4BF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="end" xml:space="preserve">Iatronix backend</text><text x="634.0" y="224.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="700" text-anchor="start" xml:space="preserve">DB-free leaf functions:</text><text x="634.0" y="243.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve">fetch_evidence · rank_articles</text><text x="634.0" y="261.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" text-anchor="start" xml:space="preserve">grounding_gate · create_llm</text><rect x="616.0" y="306.0" width="240.0" height="116.0" rx="13" fill="#0F1622" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1"/><text x="736.0" y="330.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5" xml:space="preserve">EXTERNAL SERVICES</text><text x="634.0" y="352.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">PubMed / ClinicalTrials.gov</text><text x="634.0" y="368.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">Europe PMC / Semantic Scholar</text><text x="634.0" y="384.0" fill="#B0BCC9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">GEO / Tabula Sapiens</text><text x="634.0" y="400.0" fill="#8B7DF6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="600" text-anchor="start" xml:space="preserve">Anthropic API · BYOK</text><line x1="234.0" y1="284.0" x2="330.0" y2="284.0" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/><path d="M338.0 284.0 L330.0 288.0 L330.0 280.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="239.3" y="262.0" width="93.4" height="18.0" rx="9.0" fill="#131A24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/><text x="286.0" y="273.7" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="7.5" font-weight="600" text-anchor="middle" xml:space="preserve">generate_experiment()</text><line x1="338.0" y1="320.0" x2="242.0" y2="320.0" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/><path d="M234.0 320.0 L242.0 316.0 L242.0 324.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="238.3" y="324.0" width="95.4" height="18.0" rx="9.0" fill="#131A24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/><text x="286.0" y="336.1" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">TransBrief · JSON</text><line x1="564.0" y1="294.0" x2="611.0" y2="236.2" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><path d="M616.0 230.0 L614.1 238.7 L607.9 233.7 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="568.6" y="253.0" width="42.7" height="18.0" rx="9.0" fill="#131A24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/><text x="590.0" y="265.1" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">import</text><line x1="564.0" y1="310.0" x2="610.5" y2="358.2" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/><path d="M616.0 364.0 L607.6 361.0 L613.3 355.5 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="566.2" y="328.0" width="47.5" height="18.0" rx="9.0" fill="#131A24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/><text x="590.0" y="340.1" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" font-weight="600" text-anchor="middle" xml:space="preserve">queries</text><text x="44.0" y="438.0" fill="#4A5568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>
