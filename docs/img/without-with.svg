space="preserve">correctly</text><text x="450.0" y="256.5" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" xml:space="preserve">gated out</text><line x1="531.2" y1="190.0" x2="531.2" y2="250.0" stroke="#e4e9f1" stroke-width="1"/><text x="612.4" y="222.0" fill="#7c3aed" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" text-anchor="middle" xml:space="preserve">2</text><text x="612.4" y="242.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" xml:space="preserve">unverifiable</text><text x="612.4" y="256.5" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" xml:space="preserve">datasets caught</text><line x1="693.6" y1="190.0" x2="693.6" y2="250.0" stroke="#e4e9f1" stroke-width="1"/><text x="774.8" y="222.0" fill="#0e7490" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="800" text-anchor="middle" xml:space="preserve">0</text><text x="774.8" y="242.0" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" xml:space="preserve">fabricated</text><text x="774.8" y="256.5" fill="#5b6b82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="middle" xml:space="preserve">citations</text><rect x="44.0" y="302.0" width="395.0" height="280.0" rx="14" fill="#fdecef" stroke="#f6c3ce" stroke-width="1"/><rect x="60.0" y="316.0" width="30.0" height="30.0" rx="9" fill="#ffffff" stroke="#f6c3ce" stroke-width="1"/><path d="M69.0 321.5 l9.5 9.5 M78.5 321.5 l-9.5 9.5" fill="none" stroke="#e11d48" stroke-width="2.47" stroke-linecap="round"/><text x="100.0" y="336.0" fill="#e11d48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" text-anchor="start" xml:space="preserve">Plain LLM  —  no connector</text><line x1="60.0" y1="354.0" x2="423.0" y2="354.0" stroke="#f6c3ce" stroke-width="1"/><path d="M66.0 354.0 l7.0 7.0 M73.0 354.0 l-7.0 7.0" fill="none" stroke="#e11d48" stroke-width="1.82" stroke-linecap="round"/><text x="86.0" y="364.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Citations: plausible-looking PMIDs, often</text><text x="86.0" y="383.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">fabricated or not about the claim</text><path d="M66.0 407.0 l7.0 7.0 M73.0 407.0 l-7.0 7.0" fill="none" stroke="#e11d48" stroke-width="1.82" stroke-linecap="round"/><text x="86.0" y="417.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Novelty: confidently reframes textbook facts as</text><text x="86.0" y="436.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">‘novel findings’</text><path d="M66.0 460.0 l7.0 7.0 M73.0 460.0 l-7.0 7.0" fill="none" stroke="#e11d48" stroke-width="1.82" stroke-linecap="round"/><text x="86.0" y="470.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" 