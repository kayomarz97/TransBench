<svg xmlns="http://www.w3.org/2000/svg" width="820" height="462" viewBox="0 0 820 462" role="img" aria-label="Without vs. with the TransBench connector — quantified on 4 real captured runs"><rect x="0.5" y="0.5" width="819" height="461" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="0.5" y="0.5" width="819" height="40" rx="10" fill="#161b22"/><rect x="0.5" y="30" width="819" height="11" fill="#161b22"/><line x1="0" y1="41" x2="820" y2="41" stroke="#30363d"/><circle cx="20" cy="20" r="5" fill="#f85149"/><circle cx="38" cy="20" r="5" fill="#d29922"/><circle cx="56" cy="20" r="5" fill="#3fb950"/><text x="76" y="25" fill="#8b949e" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">Without vs. with the TransBench connector — quantified on 4 real captured runs</text><text x="24" y="52" fill="#c9d1d9" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="15" font-weight="bold" xml:space="preserve">Same question. One connector of difference.</text><rect x="24" y="60" width="374" height="324" rx="8" fill="#161b22" stroke="#30363d"/><text x="40" y="86" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" xml:space="preserve">Plain LLM  —  no connector</text><path d="M40 102 l11 11 M51 102 l-11 11" fill="none" stroke="#f85149" stroke-width="2.4" stroke-linecap="round"/><text x="58" y="113" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Citations: plausible-looking PMIDs,</text><text x="58" y="134" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">often fabricated or not about the claim</text><path d="M40 152 l11 11 M51 152 l-11 11" fill="none" stroke="#f85149" stroke-width="2.4" stroke-linecap="round"/><text x="58" y="163" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Novelty: confidently reframes textbook</text><text x="58" y="184" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">facts as 'novel findings'</text><path d="M40 202 l11 11 M51 202 l-11 11" fill="none" stroke="#f85149" stroke-width="2.4" stroke-linecap="round"/><text x="58" y="213" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Dataset: names a GEO accession that may</text><text x="58" y="234" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">not exist — or is a different study</text><path d="M40 252 l11 11 M51 252 l-11 11" fill="none" stroke="#f85149" stroke-width="2.4" stroke-linecap="round"/><text x="58" y="263" fill="#f85149" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Answers every question with equal</text><text x="58" y="284" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">confidence, even with no evidence</text><rect x="422" y="60" width="374" height="324" rx="8" fill="#161b22" stroke="#30363d"/><text x="438" y="86" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="bold" xml:space="preserve">TransBench connector</text><path d="M438 108 l4 5 l8 -12" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="113" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Every citation is a real, resolvable</text><text x="456" y="134" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">PubMed / trial record — or the claim is</text><text x="456" y="155" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">dropped</text><path d="M438 179 l4 5 l8 -12" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="184" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Novelty gate demotes 'established'</text><text x="456" y="205" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">claims; only open questions are promoted</text><path d="M438 229 l4 5 l8 -12" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="234" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Dataset gate verifies each proposed</text><text x="456" y="255" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">accession against the real record —</text><text x="456" y="276" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">rejected 2 unverifiable ones here</text><path d="M438 300 l4 5 l8 -12" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="456" y="305" fill="#3fb950" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">Refuses to ship an experiment when</text><text x="456" y="326" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">nothing clears the bar (2 of 4 domains,</text><text x="456" y="347" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">gated not faked)</text><rect x="24" y="396" width="772" height="34" rx="8" fill="#161b22" stroke="#30363d"/><text x="40" y="414" fill="#c9d1d9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="normal" xml:space="preserve">4 real domains tested   ·   2 runnable experiments shipped   ·   2 correctly gated out   ·   2 unverifiable datasets caught   ·   0 fabricated citations</text></svg>