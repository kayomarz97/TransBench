solvable PubMed /</text><text x="503.0" y="383.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">trial record — or the claim is dropped</text><path d="M481.0 415.0 l3.4 4.1 l7.4 -10.7" fill="none" stroke="#0e9f6e" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round"/><text x="503.0" y="417.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Novelty gate demotes ‘established’ claims; only</text><text x="503.0" y="436.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">open questions are promoted</text><path d="M481.0 468.0 l3.4 4.1 l7.4 -10.7" fill="none" stroke="#0e9f6e" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round"/><text x="503.0" y="470.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Dataset gate verifies each accession against the</text><text x="503.0" y="489.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">real record — caught 2 here</text><path d="M481.0 521.0 l3.4 4.1 l7.4 -10.7" fill="none" stroke="#0e9f6e" stroke-width="2.13" stroke-linecap="round" stroke-linejoin="round"/><text x="503.0" y="523.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">Ships nothing when nothing clears the bar — 2 of 4</text><text x="503.0" y="542.0" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">domains gated, not faked</text><text x="44.0" y="592.0" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>