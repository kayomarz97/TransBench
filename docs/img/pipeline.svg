<svg xmlns="http://www.w3.org/2000/svg" width="900" height="898" viewBox="0 0 900 898" role="img" aria-label="TransBench pipeline: a clinician observation is decomposed into axes, expanded into up to three falsifiable hypotheses, graded against multi-database retrieval, then filtered by three rigor gates (entailment, grounding, novelty). If any hypothesis is both an open question and grounded, a content-verified experiment is designed; otherwise no experiment is shipped. Everything is assembled into a schema-valid TransBrief with a claude_science_prompt."><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B7DF6"/></linearGradient><radialGradient id="glowT" cx="0.12" cy="0.95" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.08"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient><radialGradient id="glowV" cx="0.9" cy="0.06" r="0.45"><stop offset="0" stop-color="#8B7DF6" stop-opacity="0.10"/><stop offset="1" stop-color="#8B7DF6" stop-opacity="0"/></radialGradient><clipPath id="card"><rect x="16" y="16" width="868" height="866" rx="18"/></clipPath></defs><rect x="16" y="16" width="868" height="866" rx="18" fill="#0A0E14" stroke="#ffffff" stroke-opacity="0.09"/><g clip-path="url(#card)"><rect x="16" y="16" width="868" height="866" fill="url(#glowT)"/><rect x="16" y="16" width="868" height="866" fill="url(#glowV)"/></g><text x="44" y="49.0" fill="url(#brand)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="0.2">TransBench</text><text x="44" y="67.0" fill="#7D8A9C" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" letter-spacing="0.1">8 agents · 3 rigor gates</text><text x="856" y="52.0" fill="#4A5568" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="0.16" text-anchor="end">HOW IT WORKS</text><line x1="44" y1="83" x2="856" y2="83" stroke="#ffffff" stroke-opacity="0.07"/><text x="44.0" y="122.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="start" xml:space="preserve">Eight agents, three gates — nothing unsupported can pass</text><text x="44.0" y="144.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="start" xml:space="preserve">A clinician's sentence goes in; a grounded, testable brief comes out.</text><rect x="300.0" y="170.0" width="300.0" height="52.0" rx="12" fill="#131A24" stroke="#2DD4BF" stroke-opacity="0.5" stroke-width="1"/><text x="450.0" y="192.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">Clinician observation</text><text x="450.0" y="209.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">free text · any disease, drug, mechanism</text><path d="M450.0 222.0 L450.0 242.0 L139.5 242.0 L139.5 253.0" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M139.5 262.0 L135.0 253.0 L144.0 253.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="44.0" y="262.0" width="191.0" height="66.0" rx="12" fill="#131A24" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/><circle cx="67.0" cy="295.0" r="13" fill="#2DD4BF"/><text x="67.0" y="299.5" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" xml:space="preserve">1</text><text x="90.0" y="290.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve">Decompose</text><text x="90.0" y="305.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">axes + disease anchor</text><rect x="251.0" y="262.0" width="191.0" height="66.0" rx="12" fill="#131A24" stroke="#8B7DF6" stroke-opacity="0.45" stroke-width="1"/><circle cx="274.0" cy="295.0" r="13" fill="#8B7DF6"/><text x="274.0" y="299.5" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" xml:space="preserve">2</text><text x="297.0" y="290.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve">Hypothesize</text><text x="297.0" y="305.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">≤3 falsifiable mechanisms</text><rect x="458.0" y="262.0" width="191.0" height="66.0" rx="12" fill="#131A24" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/><circle cx="481.0" cy="295.0" r="13" fill="#2DD4BF"/><text x="481.0" y="299.5" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" xml:space="preserve">3</text><text x="504.0" y="290.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve">Retrieve</text><text x="504.0" y="305.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">multi-DB · PubMed + EPMC</text><rect x="665.0" y="262.0" width="191.0" height="66.0" rx="12" fill="#131A24" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/><circle cx="688.0" cy="295.0" r="13" fill="#2DD4BF"/><text x="688.0" y="299.5" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" xml:space="preserve">4</text><text x="711.0" y="290.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" text-anchor="start" xml:space="preserve">Grade</text><text x="711.0" y="305.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">supports / refutes + grade</text><line x1="235.0" y1="295.0" x2="243.0" y2="295.0" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M251.0 295.0 L243.0 299.0 L243.0 291.0 z" fill="#2DD4BF" fill-opacity="0.7"/><line x1="442.0" y1="295.0" x2="450.0" y2="295.0" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M458.0 295.0 L450.0 299.0 L450.0 291.0 z" fill="#2DD4BF" fill-opacity="0.7"/><line x1="649.0" y1="295.0" x2="657.0" y2="295.0" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M665.0 295.0 L657.0 299.0 L657.0 291.0 z" fill="#2DD4BF" fill-opacity="0.7"/><path d="M760.5 328.0 L760.5 348.0 L450.0 348.0 L450.0 359.0" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M450.0 368.0 L445.5 359.0 L454.5 359.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="44.0" y="368.0" width="812.0" height="104.0" rx="13" fill="#131A24" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/><text x="62.0" y="395.0" fill="#2DD4BF" font-family="ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.8" xml:space="preserve">5–6 · RIGOR GATES</text><text x="840.0" y="395.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" text-anchor="end" xml:space="preserve">anything unsupported cannot pass</text><rect x="60.0" y="408.0" width="249.3" height="50.0" rx="10" fill="#0F1620" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/><text x="75.0" y="429.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="start" xml:space="preserve">Entailment</text><text x="75.0" y="446.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">does the source really support it?</text><rect x="325.3" y="408.0" width="249.3" height="50.0" rx="10" fill="#0F1620" stroke="#F0637A" stroke-opacity="0.45" stroke-width="1"/><text x="340.3" y="429.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="start" xml:space="preserve">Grounding</text><text x="340.3" y="446.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">no resolvable citation → <tspan fill="#F0637A" font-weight="700">dropped</tspan></text><rect x="590.7" y="408.0" width="249.3" height="50.0" rx="10" fill="#0F1620" stroke="#F5B759" stroke-opacity="0.45" stroke-width="1"/><text x="605.7" y="429.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="start" xml:space="preserve">Novelty</text><text x="605.7" y="446.0" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.4" font-weight="500" text-anchor="start" xml:space="preserve">textbook fact → <tspan fill="#F5B759" font-weight="700">demoted</tspan>, never novel</text><line x1="450.0" y1="472.0" x2="450.0" y2="496.0" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M450.0 505.0 L445.5 496.0 L454.5 496.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="224.0" y="508.0" width="452.0" height="46.0" rx="23.0" fill="#131A24" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/><text x="450.0" y="537.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">Is any hypothesis an open question  AND  grounded?</text><path d="M380.0 554.0 L380.0 576.0 L222.0 576.0 L222.0 589.0" fill="none" stroke="#34D399" stroke-opacity="0.7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M222.0 598.0 L217.5 589.0 L226.5 589.0 z" fill="#34D399"/><path d="M520.0 554.0 L520.0 576.0 L678.0 576.0 L678.0 589.0" fill="none" stroke="#F5B759" stroke-opacity="0.7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M678.0 598.0 L673.5 589.0 L682.5 589.0 z" fill="#F5B759"/><rect x="365.0" y="554.2" width="42.2" height="21.5" rx="10.75" fill="#34D399"/><text x="386.1" y="568.6" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">yes</text><rect x="505.0" y="554.2" width="35.4" height="21.5" rx="10.75" fill="#F5B759"/><text x="522.7" y="568.6" fill="#0A0E14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" text-anchor="middle" xml:space="preserve">no</text><rect x="44.0" y="598.0" width="356.0" height="64.0" rx="12" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.5" stroke-width="1"/><text x="222.0" y="626.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">7 · Design experiment</text><text x="222.0" y="643.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">content-verified dataset + runnable protocol</text><rect x="500.0" y="598.0" width="356.0" height="64.0" rx="12" fill="#F5B759" fill-opacity="0.09" stroke="#F5B759" stroke-opacity="0.5" stroke-width="1"/><text x="678.0" y="626.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">No experiment shipped</text><text x="678.0" y="643.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">honest refusal, not a fabrication</text><path d="M222.0 662.0 L222.0 684.0 L404.0 684.0 L404.0 697.0" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M404.0 706.0 L399.5 697.0 L408.5 697.0 z" fill="#2DD4BF" fill-opacity="0.7"/><path d="M678.0 662.0 L678.0 684.0 L496.0 684.0 L496.0 697.0" fill="none" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M496.0 706.0 L491.5 697.0 L500.5 697.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="290.0" y="706.0" width="320.0" height="50.0" rx="12" fill="#131A24" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/><text x="450.0" y="727.6" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle" xml:space="preserve">8 · Assemble TransBrief</text><text x="450.0" y="744.6" fill="#7D8A9C" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="500" text-anchor="middle" xml:space="preserve">schema-valid · full run manifest</text><line x1="450.0" y1="756.0" x2="450.0" y2="778.0" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/><path d="M450.0 787.0 L445.5 778.0 L454.5 778.0 z" fill="#2DD4BF" fill-opacity="0.7"/><rect x="215.0" y="790.0" width="470.0" height="54.0" rx="12" fill="#2DD4BF" fill-opacity="0.10" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="1"/><text x="450.0" y="813.0" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="800" text-anchor="middle" xml:space="preserve">TransBrief</text><text x="450.0" y="830.0" fill="#B8C4D0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.6" font-weight="600" text-anchor="middle" xml:space="preserve">references · top_experiment · claude_science_prompt  →  Claude Science</text><text x="44.0" y="866.0" fill="#4A5568" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" text-anchor="start" xml:space="preserve">Research hypothesis generation only. Not clinical, diagnostic, or prescribing advice.</text></svg>
