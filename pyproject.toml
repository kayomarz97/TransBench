[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transbench"
version = "0.1.0"
description = "TransBench -- translational clinician<->bench agent, shipped as an MCP connector for Claude Science. Reuses the Iatronix backend read-only."
requires-python = ">=3.11"
# BUILD_SPEC §1's curated set (Phase 0) + python-dotenv (Phase 2, deliberate addition):
# config.py loads this repo's own gitignored .env with override=True so a stale/invalid
# ANTHROPIC_API_KEY already sitting in the ambient process env never wins over the real
# BYOK key in .env -- required for the engine's own Anthropic calls to work uniformly
# across tests, the engine, and (Phase 6) the MCP server.
dependencies = [
    "iatronix-backend",
    "mcp",
    "langgraph",
    "langchain",
    "langchain-anthropic",
    "langchain-core",
    "anthropic",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "fastapi",
    "json-repair",
    "tenacity",
    "python-dotenv",
]

[tool.uv.sources]
iatronix-backend = { path = "/root/projects/med-ai-project/backend", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# Test tooling only -- deliberately NOT in [project].dependencies (BUILD_SPEC §1's
# curated runtime list is exact/frozen). Needed to run tests/*.py per Phase 0/7 acceptance.
dev = ["pytest", "pytest-asyncio"]
